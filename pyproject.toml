[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fm-agentic-e2e-gcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.2.0",
    "google-cloud-aiplatform",
    "google-genai",
    "python-dotenv",
    "pydantic",
    "pyyaml",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "mcp>=1.28.1",
    "google-cloud-trace>=1.20.0",
    "google-cloud-bigquery>=3.25.0",
    "numpy>=2.4.6",
    "faiss-cpu>=1.15.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["agents", "tools", "eval_harness", "observability", "memory", "services", "api", "mcp_servers", "skills"]

[project.scripts]
run-agent-eval = "eval_harness.runners.run_agent_eval:main"
release-gate = "eval_harness.release_gate.gate:main"
skill-eval = "eval_harness.skill_eval:main"
run-retrieval-eval = "eval_harness.runners.run_retrieval_eval:main"
fm-agentops-api = "api.main:main"
workorder-a2a = "agents.workorder_agent.a2a_server:main"

[tool.pytest.ini_options]
# Limit collection to tests/ so manual verification scripts are not collected.
testpaths = ["tests"]
python_files = ["test_*.py"]
